<text x="680" y="292" font-size="16" text-anchor="middle" fill="#17391f" font-weight="700">Sensor de humedad</text>
<text x="680" y="314" font-size="12" text-anchor="middle" fill="#4a6b53" font-weight="500">capacitivo v1.2</text>
<rect x="556" y="296" width="8" height="8" fill="#555"/>
<text x="570" y="304" font-size="11" text-anchor="start" fill="#2f7a4a" font-weight="700">AOUT</text>
<rect x="796" y="271" width="8" height="8" fill="#555"/>
<text x="792" y="279" font-size="11" text-anchor="end" fill="#2f7a4a" font-weight="700">VCC</text>
<rect x="796" y="321" width="8" height="8" fill="#555"/>
<text x="792" y="329" font-size="11" text-anchor="end" fill="#2f7a4a" font-weight="700">GND</text>
<path d="M300 300 H560" fill="none" stroke="#e08a00" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
<path d="M800 275 H860 V100" fill="none" stroke="#d9362b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="860" cy="100" r="5" fill="#d9362b"/>
<path d="M800 325 H840 V560" fill="none" stroke="#222" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="840" cy="560" r="5" fill="#222"/>
<rect x="420" y="380" width="140" height="80" rx="10" fill="#eef3fb" stroke="#2f6fd1" stroke-width="2" stroke-dasharray="7 5"/>
