<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="Inter,Arial,sans-serif">
<rect width="1100" height="760" fill="#fff"/>
<text x="30" y="38" font-size="24" text-anchor="start" fill="#111" font-weight="700">Monitor de riego (1 sensor) — conexiones</text>
<text x="30" y="60" font-size="13" text-anchor="start" fill="#666" font-weight="500">Solo hay conexión donde hay un punto ●. El DHT22 (punteado) es opcional. ▲ 3V3 = va a la línea de 3V3.</text>
<path d="M50 100 H900" fill="none" stroke="#d9362b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
