<text x="290" y="305" font-size="15" text-anchor="end" fill="#fff" font-weight="700">A0</text>
<rect x="296" y="416" width="8" height="8" fill="#555"/>
<text x="290" y="425" font-size="15" text-anchor="end" fill="#fff" font-weight="700">D1</text>
<path d="M100 240 H50 V100" fill="none" stroke="#d9362b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="50" cy="100" r="5" fill="#d9362b"/>
<path d="M100 280 H30 V560" fill="none" stroke="#222" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="30" cy="560" r="5" fill="#222"/>
