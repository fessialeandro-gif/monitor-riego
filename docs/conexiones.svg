<rect x="496" y="376" width="8" height="8" fill="#555"/>
<text x="500" y="394" font-size="9" text-anchor="middle" fill="#2f6fd1" font-weight="700">VCC</text>
<rect x="526" y="456" width="8" height="8" fill="#555"/>
<text x="530" y="454" font-size="9" text-anchor="middle" fill="#2f6fd1" font-weight="700">GND</text>
<path d="M530 460 V560" fill="none" stroke="#222" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<circle cx="530" cy="560" r="5" fill="#222"/>
<path d="M500 380 V350" fill="none" stroke="#d9362b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<path d="M490 350 H510 L500 338 Z" fill="#d9362b"/>
<text x="516" y="346" font-size="11" text-anchor="start" fill="#d9362b" font-weight="700">3V3</text>
<path d="M360 420 V400" fill="none" stroke="#1f9d55" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<circle cx="360" cy="420" r="5" fill="#1f9d55"/>
<path d="M360 400 l8 -4 l-16 -8 l16 -8 l-16 -8 l16 -8 l-8 -4 V350" fill="none" stroke="#555" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M350 350 H370 L360 338 Z" fill="#d9362b"/>
<text x="376" y="346" font-size="11" text-anchor="start" fill="#d9362b" font-weight="700">3V3</text>
<text x="376" y="392" font-size="11" text-anchor="start" fill="#555" font-weight="700">10 kΩ</text>
<line x1="30" y1="630" x2="1070" y2="630" stroke="#ddd"/>
<text x="30" y="662" font-size="13" text-anchor="start" fill="#111" font-weight="700">Sensor</text>
<text x="100" y="662" font-size="13" text-anchor="start" fill="#333" font-weight="500">VCC → 3V3 · GND → GND · AOUT → A0</text>
<text x="30" y="690" font-size="13" text-anchor="start" fill="#111" font-weight="700">DHT22</text>
<text x="100" y="690" font-size="13" text-anchor="start" fill="#333" font-weight="500">VCC → 3V3 · GND → GND · DATA → D1 (+10 kΩ a 3V3, el módulo de 3 pines ya la trae)</text>
<text x="30" y="718" font-size="13" text-anchor="start" fill="#111" font-weight="700">Ojo</text>
<text x="100" y="718" font-size="13" text-anchor="start" fill="#333" font-weight="500">Alimentá el sensor con 3V3, no con 5V: el A0 del NodeMCU acepta hasta 3,3 V. Si no ponés el DHT, en el código USAR_DHT = false.</text>
</svg>