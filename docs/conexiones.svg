<text x="910" y="565" font-size="14" text-anchor="start" fill="#222" font-weight="700">GND</text>
<rect x="100" y="150" width="200" height="360" rx="10" fill="#1f3b57" stroke="#333" stroke-width="2" />
<text x="200" y="180" font-size="17" text-anchor="middle" fill="#fff" font-weight="700">NodeMCU</text>
<text x="200" y="200" font-size="13" text-anchor="middle" fill="#cfe0f0" font-weight="500">ESP8266</text>
<rect x="170" y="480" width="60" height="30" rx="4" fill="#bbb" stroke="#333"/>
<text x="200" y="535" font-size="12" text-anchor="middle" fill="#444" font-weight="500">USB 5V (alimentación)</text>
